<div class="content-container">

  <h1 class="login__titulo">Entrar</h1>

  <form>
    <label for="email">Login</label><br />
    <input class="input-simples"
      id="email"
      name="email"
      type="text"
      placeholder="Digite seu login"
      [(ngModel)]="login"
    />

    <label for="input-senha">Senha</label><br />
    <input class="input-simples"
      id="input-senha"
      name="input-senha"
      type="password"
      placeholder="Digite sua senha"
      [(ngModel)]="senha"
    />

    <button
      class="input-submeter"
      type="button"
      [disabled]="!login || !senha"
      (click)="onBotaoClicado()"
    >
      Confirmar
    </button>
  </form>

  <p class="login__link">
    Ainda não tem conta? <a routerLink="/CadastroClientes">Cadastre-se</a>
  </p>

</div>
